<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>杭电特色班报名系统</title>
  <!-- 全局字体：系统默认中文字体栈 -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }

    /* ===== Header：纯 HTML，不固定定位，随文档流 ===== */
    .app-header {
      /* position: fixed; */   /* ← 主人要求注释：不固定，随文档流排列 */
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 60px;
      background: #337eff;
      color: #fff;
      z-index: 9999;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      padding: 0 0 0 20px;
    }
    .app-header a {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }
    .app-header .logo-icon { font-size: 28px; line-height: 1; }
    .app-header .logo-text { font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }

    /* 移动端：Header 略矮 */
    @media (max-width: 768px) {
      .app-header { height: 52px; }
      .app-header .logo-icon { font-size: 24px; }
      .app-header .logo-text { font-size: 15px; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <a href="#/home">
      <span class="logo-icon">🎓</span>
      <span class="logo-text">杭电特色班报名</span>
    </a>
  </header>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
