# ============================================================
# 杭电信工学院特色班报名系统 · 生产环境 profile
# 启动：mvnw.cmd spring-boot:run --spring.profiles.active=prod
# 或：  java -jar enroll-server.jar --spring.profiles.active=prod
# ============================================================

server:
  port: 80  # 生产用 80（需 root 权限）或 8080

spring:
  jpa:
    show-sql: false            # 生产关掉 SQL 打印
    hibernate:
      ddl-auto: validate       # 生产不自动改表（只校验）

logging:
  level:
    root: WARN
    com.enroll.server: INFO
