<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>API 测试页 v2</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 50px auto; }
    input, button { display: block; width: 100%; margin: 8px 0; padding: 10px; font-size: 16px; }
    button { background: #337ffe; color: #fff; border: none; cursor: pointer; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; white-space: pre-wrap; }
    .error { color: red; }
    .ok { color: green; }
  </style>
</head>
<body>
  <h2>API 测试页 v2（模拟 request() 函数）</h2>
  <input id="phone" placeholder="手机号" value="***REMOVED***" />
  <input id="code" placeholder="验证码" value="666666" />
  <button onclick="testLogin()">1. 测试登录（模拟 loginByCodeAPI）</button>
  <button onclick="testSendCode()">2. 测试发码（模拟 sendCodeAPI）</button>
  <pre id="result">点按钮测试...</pre>

  <script>
    // 精确模拟 api.js 的 request() 函数
    async function request(url, options = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      })
      if (!res.ok) {
        const err = new Error('HTTP ' + res.status + ': ' + res.statusText)
        err.status = res.status
        throw err
      }
      return res.json()
    }

    // 模拟 api.js 的 loginByCodeAPI
    function loginByCodeAPI(phone, code) {
      return request('/api/auth/login/sms', {
        method: 'POST',
        body: JSON.stringify({ phone: phone, code: code }),
      })
    }

    // 模拟 api.js 的 sendCodeAPI
    function sendCodeAPI(phone) {
      return request('/api/auth/send-code', {
        method: 'POST',
        body: JSON.stringify({ phone: phone }),
      })
    }

    async function testLogin() {
      var phone = document.getElementById('phone').value
      var code = document.getElementById('code').value
      var result = document.getElementById('result')
      result.textContent = 'phone=' + phone + ' code=' + code + '\n请求中...'
      result.className = ''

      try {
        var data = await loginByCodeAPI(phone, code)
        result.textContent = 'phone=' + phone + ' code=' + code + '\n\nOK loginByCodeAPI:\n' + JSON.stringify(data, null, 2)
        result.className = 'ok'
      } catch (err) {
        result.textContent = 'phone=' + phone + ' code=' + code + '\n\nFAIL loginByCodeAPI:\n' + err.message + '\n\n' + (err.stack || 'no stack')
        result.className = 'error'
      }
    }

    async function testSendCode() {
      var phone = document.getElementById('phone').value
      var result = document.getElementById('result')
      result.textContent = 'phone=' + phone + '\n请求中...'
      result.className = ''

      try {
        var data = await sendCodeAPI(phone)
        result.textContent = 'phone=' + phone + '\n\nOK sendCodeAPI:\n' + JSON.stringify(data, null, 2)
        result.className = 'ok'
      } catch (err) {
        result.textContent = 'phone=' + phone + '\n\nFAIL sendCodeAPI:\n' + err.message + '\n\n' + (err.stack || 'no stack')
        result.className = 'error'
      }
    }
  </script>
</body>
</html>
