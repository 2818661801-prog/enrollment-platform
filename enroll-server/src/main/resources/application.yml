server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/enroll_db?useSSL=false&serverTimezone=Asia/Shanghai&connectionTimeZone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: enroll
    password: ***REMOVED***
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    default-property-inclusion: always

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      key-prefix: ""

sms:
  sn: SDK-BBX-010-39560
  pwd: 3365CB7EB11EEC171571E8E91C61EF30
  url: http://***REMOVED***:8061/mdsmssend.ashx
  sign: 【杭州电子科技大学信息工程学院】
  test-mode: false

jwt:
  enabled: true
  secret: ${JWT_SECRET:***REMOVED***}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    root: OFF
    com.enroll.server: OFF
    org.hibernate: OFF
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    # 第三方库 WARN 清理
    org.apache: OFF           # Tomcat
    io.netty: OFF             # Netty
    com.google: OFF           # Guava
    sun.net: OFF              # Sun-net
    java.sql: OFF             # JDBC
