server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/enroll_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: enroll
    password: ***REMOVED***
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    default-property-inclusion: always

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      key-prefix: ""

sms:
  sn: ${SMS_SN:SDK-BBX-010-39560}
  pwd: ${SMS_PWD:}
  url: http://***REMOVED***:8061/mdsmssend.ashx
  sign: 【杭州电子科技大学信息工程学院】

jwt:
  enabled: true
  secret: ${JWT_SECRET:***REMOVED***}
  expiration: 86400000
  header: Authorization
  prefix: "Bearer "

logging:
  level:
    com.enroll.server: INFO
    org.hibernate.SQL: DEBUG
